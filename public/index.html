<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Personal Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Application Header -->
  <header class="app-header">
    <div class="container">
      <h1>TaskFlow</h1>
      <p>Personal Task Management System</p>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="container main-layout">

    <!-- Add / Edit Task Form Section -->
    <section class="card form-section">
      <h2 id="form-heading">Add New Task</h2>
      <!-- Success / Error Feedback Banner -->
      <div id="feedback" class="feedback-msg" role="status" aria-live="polite"></div>

      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="title">Task Title <span class="required">*</span></label>
          <input type="text" id="title" name="title" placeholder="e.g., Complete Day 2 Milestone" required />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="Add details about this task..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dueDate">Due Date (Optional)</label>
            <input type="date" id="dueDate" name="dueDate" />
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="pending" selected>Pending</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">Add Task</button>
        <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel Edit</button>
      </form>
    </section>

    <!-- Task List Section -->
    <section class="card list-section">
      <div class="list-header">
        <h2>My Tasks</h2>
        <span class="badge" id="task-count">0 Tasks</span>
      </div>

      <div id="task-list" class="task-list">
        <p class="empty-state">Loading tasks from database...</p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
